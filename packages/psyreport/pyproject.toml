[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "psyreport"
version = "0.1.1"
description = "APA-7 reporting of psychological statistics results"
readme = "README.md"
license = "MIT"
authors = [{ name = "Luis Anunciacao", email = "luisfca@gmail.com" }]
requires-python = ">=3.10"
# jinja2 is required by to_latex(): pandas routes DataFrame.to_latex through
# Styler, which imports jinja2 lazily and raises ImportError without it.
dependencies = ["numpy>=1.24", "pandas>=2.0", "python-docx>=1.1", "jinja2>=3.0"]
keywords = ["apa", "reporting", "apa7", "psychology", "tables", "docx", "latex"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/anovabr/anova-methods"
Source = "https://github.com/anovabr/anova-methods"
Lab = "https://labmm.org/"
ORCID = "https://orcid.org/0000-0001-5303-5782"

[tool.hatch.build.targets.wheel]
packages = ["src/psyreport"]
