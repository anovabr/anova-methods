[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "psymetrics"
version = "0.1.0"
description = "Reliability, factor analysis and SEM for psychologists with an R-like API"
readme = "README.md"
license = "MIT"
authors = [{ name = "Luis Anunciacao", email = "luisfca@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "factor_analyzer>=0.5", "scikit-learn<1.6"]
keywords = ["reliability", "cronbach alpha", "factor analysis", "sem", "psychometrics"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
sem = ["semopy>=2.3"]

[project.urls]
Homepage = "https://github.com/anovabr/anova-methods"
Source = "https://github.com/anovabr/anova-methods"
Lab = "https://labmm.org/"
ORCID = "https://orcid.org/0000-0001-5303-5782"

[tool.hatch.build.targets.wheel]
packages = ["src/psymetrics"]
